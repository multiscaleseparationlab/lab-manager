<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리 · 시약 관리</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <header id="app-header"></header>
  <main class="container">
    <h1>관리</h1>
    <section class="card">
      <h2>보관함</h2>
      <form id="cab-form" class="row wrap">
        <input name="name" placeholder="보관함 이름 (예: 인화성 캐비닛 B)" required>
        <input name="shelf" placeholder="칸/선반 (선택)">
        <select name="cabinet_type"></select>
        <button class="primary" type="submit">추가</button>
      </form>
      <div id="cab-list"></div>
    </section>
    <section class="card">
      <h2>승인된 사용자</h2>
      <p class="muted">여기 등록된 Google 계정만 로그인 후 사용할 수 있습니다.</p>
      <form id="user-form" class="row wrap">
        <input name="email" type="email" placeholder="이메일 (Google 계정)" required>
        <input name="name" placeholder="이름">
        <label class="inline"><input name="is_admin" type="checkbox"> 관리자</label>
        <button class="primary" type="submit">추가</button>
      </form>
      <div id="user-list"></div>
    </section>
  </main>
</body>
</html>
